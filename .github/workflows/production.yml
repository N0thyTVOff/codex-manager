name: Validation de release et production

# Aucune branche ne déploie directement : seule une GitHub Release réellement publiée déclenche ce flux.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Revalider le tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup
      - run: npm run check
      - run: npm run audit:prod

  deploy-production:
    name: Déployer sur Vercel
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup
      - name: Récupérer la configuration Vercel Production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construire dans l'environnement Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 build --prod --token="$VERCEL_TOKEN"
      - name: Publier le build validé
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
