name: Validation de release et production

# Ce workflow est appelé uniquement après que Release Please a réellement créé la GitHub Release.
on:
  workflow_call:
    inputs:
      release_sha:
        description: Commit immuable associé à la GitHub Release.
        required: true
        type: string
      release_tag:
        description: Tag créé par Release Please.
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        description: Jeton Vercel transmis explicitement par le workflow appelant.
        required: true
  # Chemin de reprise contrôlé si le déploiement d'une release existante échoue.
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit immuable associé à la GitHub Release existante.
        required: true
        type: string
      release_tag:
        description: Tag d'une GitHub Release existante.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Revalider le tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: ./.github/actions/setup
      - name: Vérifier la release, le tag et le commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - run: npm run check
      - run: npm run audit:prod

  deploy-production:
    name: Déployer sur Vercel
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - uses: ./.github/actions/setup
      - name: Récupérer la configuration Vercel Production
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construire dans l'environnement Vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 build --prod --token="$VERCEL_TOKEN"
      - name: Appliquer les migrations versionnées
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 env run --environment=production --token="$VERCEL_TOKEN" -- npm run db:migrate
      - name: Créer un déploiement sans l'exposer au domaine
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@58.5.1 deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Vérifier le déploiement isolé
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          health=$(curl --fail --silent --show-error --retry 5 --retry-all-errors "$DEPLOYMENT_URL/api/health")
          HEALTH="$health" node -e 'const value = JSON.parse(process.env.HEALTH); if (value.status !== "ok") process.exit(1)'
      - name: Promouvoir le déploiement validé
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.5.1 promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
