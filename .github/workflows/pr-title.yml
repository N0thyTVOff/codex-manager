name: Titre de PR

# Ce workflow privilégié ne lit que les métadonnées et ne récupère jamais le code de la PR.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le titre
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const author = process.env.PR_AUTHOR ?? "";
          const prefix = /^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: /;
          const subject = title.replace(prefix, "");
          const subjectPattern = author === "dependabot[bot]" ? /^.+/ : /^[a-zà-öø-ÿ0-9]/u;
          if (!prefix.test(title) || !subjectPattern.test(subject)) {
            console.error("Le titre doit suivre Conventional Commits et commencer son sujet par une minuscule.");
            process.exit(1);
          }
          NODE
