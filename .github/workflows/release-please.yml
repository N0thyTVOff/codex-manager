name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release_please:
    name: Maintenir la Release PR groupée
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag_name }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Attacher la CI au commit de la Release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          # Les PR créées avec GITHUB_TOKEN ne déclenchent pas pull_request. GitHub autorise
          # toutefois workflow_dispatch : ce run fournit donc le check CI requis au même commit.
          release_branch="$(node -e "const pr = JSON.parse(process.env.RELEASE_PR); if (!pr.headBranchName?.startsWith('release-please--')) process.exit(1); process.stdout.write(pr.headBranchName)")"
          gh workflow run ci.yml --ref "$release_branch"

  production:
    name: Publier la release validée
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/production.yml
    with:
      release_sha: ${{ needs.release_please.outputs.release_sha }}
      release_tag: ${{ needs.release_please.outputs.release_tag }}
