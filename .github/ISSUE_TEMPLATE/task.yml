name: Créer une tâche technique
description: Planifier une amélioration interne vérifiable.
title: "chore: "
labels: ["technical task"]
body:
  - type: input
    id: objective
    attributes:
      label: Objectif technique
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Périmètre
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Hors périmètre
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Critères de validation
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risques
  - type: textarea
    id: dependencies
    attributes:
      label: Dépendances
